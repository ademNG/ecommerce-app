# docker-compose.yml — stack ecommerce complète (dev local)
#
# Démarrer  : docker compose up --build
# Arrêter   : docker compose down
# Logs      : docker compose logs -f <service>
#
# Seul le frontend Web est exposé à l'hôte (port 8080).
# Les API restent sur le réseau interne "ecommerce".

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"   # exposé à l'hôte pour psql / DBeaver en dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ecommerce]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Grafana (dashboards reporting) ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ecommerce]

  # ── pgAdmin (interface web pour PostgreSQL) ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ecommerce]

  # ── Catalog API ─────────────────────────────────────────────────────────────
  catalog:
    build:
      context: .
      dockerfile: src/ECommerce.Catalog.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=catalog_db;Username=ecommerce;Password=ecommerce
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ecommerce]

  # ── Ordering API ─────────────────────────────────────────────────────────────
  ordering:
    build:
      context: .
      dockerfile: src/ECommerce.Ordering.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ordering_db;Username=ecommerce;Password=ecommerce
      # Remplace le service discovery Aspire "https+http://catalog".
      # Format : services__{resourceName}__{scheme}__{index}
      - services__catalog__http__0=http://catalog:8080
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
    networks: [ecommerce]

  # ── Gateway (YARP reverse proxy) ─────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: src/ECommerce.Gateway/Dockerfile
    environment:
      # YARP résout ses destinations "https+http://catalog" et "https+http://ordering"
      # via le même mécanisme de service discovery Aspire.
      - services__catalog__http__0=http://catalog:8080
      - services__ordering__http__0=http://ordering:8080
    depends_on: [catalog, ordering]
    networks: [ecommerce]

  # ── Web (Blazor frontend) ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: src/ECommerce.Web/Dockerfile
    environment:
      # Le frontend appelle tout via le gateway ("https+http://gateway").
      - services__gateway__http__0=http://gateway:8080
    depends_on: [gateway]
    ports:
      - "8080:8080"   # seul service exposé à l'hôte
    networks: [ecommerce]

# Réseau isolé : les conteneurs se joignent par leur nom de service.
networks:
  ecommerce:
    driver: bridge

volumes:
  postgres_data:   # persistance des données entre les restarts
  grafana_data:    # persistance des dashboards Grafana
