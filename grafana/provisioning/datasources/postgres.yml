apiVersion: 1

datasources:
  - name: PostgreSQL-Reporting
    type: postgres
    uid: postgres-reporting
    url: postgres:5432
    user: ecommerce
    secureJsonData:
      password: ecommerce
    jsonData:
      database: reporting_db
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true
