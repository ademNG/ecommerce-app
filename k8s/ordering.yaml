apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordering
  template:
    metadata:
      labels:
        app: ordering
    spec:
      containers:
        - name: ordering
          image: ecommerce-app-ordering:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            # Service discovery : résout "https+http://catalog" → Service k8s catalog
            - name: services__catalog__http__0
              value: http://catalog:8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ordering
  namespace: ecommerce
spec:
  selector:
    app: ordering
  ports:
    - port: 8080
      targetPort: 8080
