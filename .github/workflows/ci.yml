# CI — Intégration Continue
# Déclenché à chaque push et pull_request vers main.
# Enchaîne : build .NET → tests → build image Docker → scan sécurité Trivy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  # ── Job 1 : Build & Test .NET ────────────────────────────────────────────────
  build-test:
    name: Build & Test (.NET ${{ env.DOTNET_VERSION }})
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installe le SDK .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restaure les packages NuGet (mis en cache automatiquement)
      - name: Restore NuGet packages
        run: dotnet restore ECommerce.slnx

      # 4. Compile en mode Release — échoue si erreur de compilation
      - name: Build (Release)
        run: dotnet build ECommerce.slnx --configuration Release --no-restore

      # 5. Lance les tests unitaires et d'intégration
      #    (aucun projet test pour l'instant — cette étape sera un no-op)
      - name: Test
        run: dotnet test ECommerce.slnx --configuration Release --no-build --verbosity normal

  # ── Job 2 : Build images Docker + scan Trivy ────────────────────────────────
  docker-scan:
    name: Docker build & Trivy scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-test   # Ne démarre que si le build .NET est vert

    strategy:
      fail-fast: false  # Continue les autres services même si un scan échoue
      matrix:
        service:
          - name: catalog
            dockerfile: src/ECommerce.Catalog.Api/Dockerfile
          - name: ordering
            dockerfile: src/ECommerce.Ordering.Api/Dockerfile
          - name: gateway
            dockerfile: src/ECommerce.Gateway/Dockerfile
          - name: web
            dockerfile: src/ECommerce.Web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Construit l'image Docker localement (pas encore de push au registry)
      - name: Build Docker image — ${{ matrix.service.name }}
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:ci \
            -f ${{ matrix.service.dockerfile }} \
            .

      # Scanne l'image avec Trivy — bloque si faille CRITICAL ou HIGH
      - name: Trivy scan — ${{ matrix.service.name }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:ci"
          format: table
          exit-code: "1"              # Fait échouer le job si faille trouvée
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true        # Ignore les CVE sans correctif disponible
